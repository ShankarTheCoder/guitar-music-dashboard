plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android { namespace 'com.guitarplay.app'; compileSdk 35
    defaultConfig {
        applicationId 'com.guitarplay.app'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
        buildConfigField 'String', 'GUITARPLAY_URL', '"https://YOUR_DEPLOYED_GUITARPLAY_URL"'
    }
    buildFeatures { buildConfig true }
}

kotlin { jvmToolchain(17) }

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
